name: ci
on: [push, pull_request]

# El CI solo lee el codigo y lo ejecuta: no publica nada, no comenta, no escribe.
# Declararlo aqui vale mas que el ajuste del repo, que otro puede cambiar sin tocar el fichero.
permissions:
  contents: read

jobs:
  test:
    # El script solo usa la stdlib, asi que lo unico que hay que probar de verdad es
    # que arranca y que la interfaz no depende de nada del entorno del autor.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.8", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: compila
        run: python -m py_compile sereno
      - name: arranca en una maquina sin sesiones
        run: |
          python sereno --version
          python sereno --help > /dev/null
          python sereno --list
          python sereno --hook
      - name: modo demo, en los dos idiomas
        run: |
          SERENO_DEMO=1 SERENO_LANG=en python sereno --list
          SERENO_DEMO=1 SERENO_LANG=es python sereno --list
          SERENO_DEMO=1 python sereno --json | python -c "import json,sys; assert json.load(sys.stdin)['sessions']"
          python sereno --demo --list
          python sereno --jsonn && exit 1 || test $? -eq 2
      - name: el modo demo no toca datos reales
        run: python tests/test_demo_aislado.py
      - name: los textos traducidos casan con las claves
        run: python tests/test_i18n.py
      - name: el TUI arranca en un pty, pinta y sale
        run: python tests/test_tui_arranca.py
      - name: no abre conexiones ni lanza binarios sin declarar
        run: python tests/test_sin_red.py
      - name: el tope de contexto sale de la cascada, no de una conjetura
        run: python tests/test_contexto.py
      - name: --json no saca conversacion y sus campos son tipados
        run: python tests/test_json_sin_conversacion.py
      - name: --watch avisa en el flanco y no repite
        run: python tests/test_watch_flanco.py
      - name: --find busca en lo dicho, no en el fichero
        run: python tests/test_find_solo_lo_dicho.py
      - name: un flag que no existe se dice, no se traga
        run: python tests/test_flags.py
      - name: una sesion reanudada se sigue hasta el fichero que escribe ahora
        run: python tests/test_sesion_reanudada.py
