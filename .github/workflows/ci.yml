name: ci
on: [push, pull_request]

# El CI solo lee el codigo y lo ejecuta: no publica nada, no comenta, no escribe.
# Declararlo aqui vale mas que el ajuste del repo, que otro puede cambiar sin tocar el fichero.
permissions:
  contents: read

jobs:
  test:
    # El script solo usa la stdlib, asi que lo unico que hay que probar de verdad es
    # que arranca y que la interfaz no depende de nada del entorno del autor.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.8", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # tmux no viene de serie en el runner, y `test_tmux_de_verdad.py` FALLA sin el
      # en vez de saltarse: es la unica via de "abrir varias" fuera de macOS, y un test
      # que se calla cuando falta su dependencia deja ese camino sin red pareciendo que
      # lo cubre. Se instala aqui para que el fallo, si lo hay, sea el de tmux faltando
      # y no un test mudo.
      - name: tmux, que el test de lanzadores lo necesita de verdad
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq tmux
          else
            brew list tmux > /dev/null 2>&1 || brew install tmux
          fi
          tmux -V
      - name: compila
        run: python -m py_compile sereno
      - name: arranca en una maquina sin sesiones
        run: |
          python sereno --version
          python sereno --help > /dev/null
          python sereno --list
          python sereno --hook
      - name: modo demo, en los dos idiomas
        run: |
          SERENO_DEMO=1 SERENO_LANG=en python sereno --list
          SERENO_DEMO=1 SERENO_LANG=es python sereno --list
          SERENO_DEMO=1 python sereno --json | python -c "import json,sys; assert json.load(sys.stdin)['sessions']"
          python sereno --demo --list
          python sereno --jsonn && exit 1 || test $? -eq 2
      # Toda la bateria, sin lista que mantener. Antes cada test era un `run:` escrito
      # a mano y de los once escritos entre la 1.22.0 y la 1.29.0 no se cableo ninguno:
      # diecisiete de cuarenta y cuatro no corrian nunca y los checks salian verdes.
      # Lo que hay en `tests/` es lo que corre, y `todos.py` imprime la frase de cada
      # fichero, que es lo que decia el `name:` de cada paso.
      - name: toda la bateria de tests
        run: python tests/todos.py
