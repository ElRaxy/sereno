<!doctype html>
<!--
  Genera docs/social-preview.png. Cuatro pasos, desde la raiz del repo:

    1. vhs docs/social-preview.tape                       # graba la tira, en modo demo
    2. ffmpeg -sseof -0.5 -i /tmp/sereno-tira.gif -frames:v 1 -y /tmp/sereno-tira.png
    3. ffmpeg -i /tmp/sereno-tira.png -vf "crop=1092:134:0:0" -y docs/social-lista.png
    4. agent-browser open "file://$PWD/docs/social-preview.html" \
       && agent-browser screenshot docs/social-preview.png --full

  Sale 1280x640 exactos, que es lo que GitHub pide, y unos 170 KB — el tope son 1 MB.
  El .png NO lo usa el README: se sube a mano en Settings > General > Social preview,
  que es la unica via (la API de GitHub no expone ese campo). Se comprueba mirando el
  `og:image` de la pagina publica del repo.

  La tira es una captura DE VERDAD del programa en modo demo, no una maqueta: si la
  interfaz cambia y esto no se regenera, se nota. Paso 1 obligatorio en modo demo — el
  tape ya lo fija— porque la lista real lleva titulos de sesiones de clientes.
-->
